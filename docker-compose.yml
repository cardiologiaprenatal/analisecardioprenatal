services:
  ml:
    build: .
    container_name: cardioprenatal-ml
    ports:
      - "8010:8010"
    environment:
      HOST: "0.0.0.0"
      PORT: "8010"
      MODEL_PATH: "models/best_model.joblib"
      DATASET_PATH: "dataset_com_id_gestante.csv"
      METRICS_PATH: "data/metricas_modelos.csv"
      APP_NAME: "CardioPrenatal-ML"
      APP_VERSION: "1.0.0"
      LOG_LEVEL: "info"
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      API_KEY: "${API_KEY}"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./analise_descritiva:/app/analise_descritiva:ro
      - ./dataset_com_id_gestante.csv:/app/dataset_com_id_gestante.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
